# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Saif Ur Rahman"
title: "Ph.D. Candidate in Computer Science"
institution: "University of Illinois Urbana-Champaign"
email: saifu2@illinois.edu
photo: saif-photo.png  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  # NOTE: v7 of the content doc does not list Google Scholar (it lists GitHub,
  # LinkedIn, Lab, CV and email). Kept here because it was specified in v3 and
  # the URL is valid -- delete this line if the omission was intentional.
  google_scholar: "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"
  github: "https://github.com/Saif2098"
  linkedin: "https://www.linkedin.com/in/saif98"
  lab: "https://isens.cs.illinois.edu/"
  cv: "papers/cv.pdf"

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1a7a6d"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "Personal academic website"
location: "Champaign, IL"
baseurl: ""
url: "https://Saif2098.github.io"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: research
  - name: publications
  - name: teaching
  # CV hidden from the top nav. The /cv/ page still builds and is reachable
  # directly; the footer links to the CV PDF. Uncomment to restore the nav item.
  # - name: cv
  #   label: "CV"

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Rahman
  first_name: [Saif Ur, S. U.]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
  - website-content-v2.md
  - ewsn26-final38.pdf
  - README.md
  - UPGRADING.md
  - LICENSE
  - setup.sh
